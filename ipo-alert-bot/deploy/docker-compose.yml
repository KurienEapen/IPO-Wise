version: '3.8'

services:
  ipo-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ipo-wise-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - IPO_BOT_DB_PATH=/app/data/ipo_bot.db
